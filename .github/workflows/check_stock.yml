name: Check Falabella Stock

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python check_stock.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SKU_ID: ${{ secrets.SKU_ID }}
      - name: Commit conteo actualizado
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add last_count.txt sobres_state.txt last_urls.txt
          git diff --staged --quiet || git commit -m "Update count"
          git push
